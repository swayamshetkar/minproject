services:
  - type: web
    name: senior-citizen-safety-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_PROVIDER
        value: none
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_MESSAGES
        value: "false"
      - key: CORS_ORIGINS
        sync: false
